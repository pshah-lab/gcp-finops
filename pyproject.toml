[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "gcp-finops"
version = "0.1.0"
description = "Google Cloud cost analysis from Cloud Billing export data: breakdowns, month-over-month change and cost allocation."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Pratham Shah" }]
dependencies = ["pandas>=2.1"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
gcp-finops = "gcp_finops.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
